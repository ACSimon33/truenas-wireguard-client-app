---

name: Lint

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python3 -m pip install pre-commit

      - name: Install hadolint
        env:
          HADOLINT_VERSION: v2.14.0
        run: |
          release_url="https://github.com/hadolint/hadolint/releases/download"
          curl -sSL \
            "${release_url}/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o hadolint
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint

      - name: Run pre-commit
        run: pre-commit run --all-files
